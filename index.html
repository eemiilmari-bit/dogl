<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bomber Cash Out - Hotseat</title>
  <style>
    :root {
      --bg: #0b1021;
      --panel: #121832;
      --accent: #5bd1ff;
      --danger: #ff5b7f;
      --safe: #74ffac;
      --text: #f5f7ff;
      --muted: #8aa0c4;
      --bonus: #ffd166;
      --grid-size: min(70vw, 420px);
      --cell-size: calc(var(--grid-size) / 5);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, rgba(91, 209, 255, 0.1), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(255, 91, 127, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
      overflow: hidden;
    }

    h1 {
      margin: 0;
      letter-spacing: 1px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .screen {
      width: min(100%, 1080px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .menu {
      background: rgba(18, 24, 50, 0.7);
      border: 1px solid rgba(91, 209, 255, 0.2);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .btn {
      background: linear-gradient(135deg, #5bd1ff, #34b3ff);
      color: #0b1021;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 12px 30px rgba(91, 209, 255, 0.35);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 6px 18px rgba(91, 209, 255, 0.3);
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .panel {
      background: rgba(18, 24, 50, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(91, 209, 255, 0.08), transparent 60%);
      pointer-events: none;
    }

    .panel.top {
      transform: rotate(180deg);
    }

    .panel .content {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .bubble {
      background: rgba(255, 255, 255, 0.06);
      padding: 14px 16px;
      border-radius: 12px;
      flex: 1;
      min-height: 80px;
      line-height: 1.4;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .bubble.small {
      font-size: 14px;
      opacity: 0.9;
    }

    .tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .board-area {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-items: start;
    }

    .board {
      width: 100%;
      max-width: var(--grid-size);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, var(--cell-size));
      grid-template-rows: repeat(5, var(--cell-size));
      gap: 6px;
      justify-content: center;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      position: relative;
      transition: transform 0.15s ease, background 0.3s ease, border-color 0.3s ease;
    }

    .cell.drop-allowed {
      border-color: var(--accent);
      background: rgba(91, 209, 255, 0.08);
    }

    .cell.mine-set {
      border: 1px solid rgba(255, 91, 127, 0.6);
      background: rgba(255, 91, 127, 0.12);
    }

    .cell.bonus-set {
      border: 1px solid rgba(255, 209, 102, 0.6);
      background: rgba(255, 209, 102, 0.14);
    }

    .cell.revealed {
      border-color: rgba(116, 255, 172, 0.7);
      background: rgba(116, 255, 172, 0.16);
    }

    .cell.locked {
      opacity: 0.35;
      pointer-events: none;
    }

    .tray {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .token {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .token.mine {
      color: var(--danger);
      background: rgba(255, 91, 127, 0.1);
      border-color: rgba(255, 91, 127, 0.5);
    }

    .token.bonus {
      color: var(--bonus);
      background: rgba(255, 209, 102, 0.12);
      border-color: rgba(255, 209, 102, 0.5);
    }

    .token.used {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hud {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      letter-spacing: 0.4px;
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .countdown {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
      margin: 8px 0;
      text-align: center;
    }

    .money {
      font-size: 28px;
      color: var(--safe);
      letter-spacing: 1px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 16, 33, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
      padding: 30px;
    }

    .overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .card {
      max-width: 720px;
      background: rgba(18, 24, 50, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
    }

    .card h2 {
      margin-top: 0;
      letter-spacing: 0.8px;
    }

    .steps {
      display: grid;
      gap: 10px;
      text-align: left;
      margin: 12px 0;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -6px);
    }

    .grid-locker {
      position: absolute;
      inset: 0;
      background: rgba(11, 16, 33, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-weight: 700;
      border-radius: 16px;
      backdrop-filter: blur(3px);
      z-index: 2;
    }

    .grid-locker.active {
      display: flex;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }

    .highlight {
      animation: pop 0.35s ease;
    }

    .money-rise {
      animation: pulse 0.4s ease;
    }

    .dramatic {
      background: radial-gradient(circle at 50% 50%, rgba(255, 91, 127, 0.24), transparent 50%);
      box-shadow: 0 0 50px rgba(255, 91, 127, 0.35);
    }

    @media (max-width: 820px) {
      .board-area {
        grid-template-columns: 1fr;
      }

      :root {
        --grid-size: min(85vw, 360px);
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="menu">
      <div>
        <h1>Bomber Cash Out</h1>
        <div class="tag">Hotseat · Two Players</div>
      </div>
      <button class="btn" id="startBtn">Start &amp; Learn</button>
    </div>

    <div class="panels">
      <div class="panel top">
        <div class="content">
          <div class="bubble small" id="topLog">P2 will read upside down. Instructions will flip for comfort.</div>
        </div>
      </div>
      <div class="panel">
        <div class="content">
          <div class="bubble" id="bottomLog">Welcome! Tap “Start &amp; Learn” to begin the guided setup.</div>
        </div>
      </div>
    </div>

    <div class="board-area">
      <div>
        <div class="hud">
          <span class="badge">Current Role: <strong id="roleLabel">Standby</strong></span>
          <span class="badge">Timer: <strong id="timer">--:--</strong></span>
          <span class="badge">Mines placed: <strong id="mineCount">0/4</strong></span>
          <span class="badge">Bonuses placed: <strong id="bonusCount">0/2</strong></span>
          <span class="badge">Bank: <strong class="money" id="bank">0 €</strong></span>
        </div>
        <div class="countdown" id="countdown"></div>
        <div class="board" id="board"></div>
        <div class="grid-locker" id="gridLocker">Grid is locked</div>
      </div>
      <div class="tray" id="tray"></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card" id="overlayCard"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const boardEl = document.getElementById('board');
    const trayEl = document.getElementById('tray');
    const timerEl = document.getElementById('timer');
    const mineCountEl = document.getElementById('mineCount');
    const bonusCountEl = document.getElementById('bonusCount');
    const bankEl = document.getElementById('bank');
    const countdownEl = document.getElementById('countdown');
    const topLog = document.getElementById('topLog');
    const bottomLog = document.getElementById('bottomLog');
    const overlay = document.getElementById('overlay');
    const overlayCard = document.getElementById('overlayCard');
    const roleLabel = document.getElementById('roleLabel');
    const toast = document.getElementById('toast');
    const gridLocker = document.getElementById('gridLocker');

    const gridSize = 5;
    const minesNeeded = 4;
    const bonusNeeded = 2;
    const safeReward = 10;
    const bonusReward = 50;

    const players = [
      { id: 'P1', bank: 0, top: false },
      { id: 'P2', bank: 0, top: true },
    ];

    let board = [];
    let phase = 'idle';
    let timer = null;
    let timerRemaining = 0;
    let currentRound = 0;
    let order = [];
    let firstRevealBomb = false;
    let placedRandomMines = 0;
    let placedRandomBonus = 0;
    let activePlayer = null;
    let hider = null;
    let guesser = null;
    let placingType = 'mine';
    let countdownTimer = null;
    let bankHolder = null;

    const beep = (pitch = 520, duration = 0.12) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = pitch;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        // noop for no audio environment
      }
    };

    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    };

    const logToPanels = (msg, emphasize = false) => {
      const text = emphasize ? `✨ ${msg}` : msg;
      topLog.textContent = text;
      bottomLog.textContent = text;
    };

    const setRole = (role) => {
      roleLabel.textContent = role;
    };

    const resetBoard = () => {
      board = Array.from({ length: gridSize * gridSize }, () => ({
        mine: false,
        bonus: false,
        revealed: false,
        exploded: false,
      }));
      boardEl.innerHTML = '';
      board.forEach((_, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = idx;
        cell.addEventListener('dragover', handleDragOver);
        cell.addEventListener('dragleave', handleDragLeave);
        cell.addEventListener('drop', handleDrop);
        cell.addEventListener('dblclick', () => handleCellRemove(idx));
        cell.addEventListener('click', () => handleReveal(idx));
        boardEl.appendChild(cell);
      });
    };

    const updateCounts = () => {
      const mines = board.filter(c => c.mine).length;
      const bonuses = board.filter(c => c.bonus).length;
      mineCountEl.textContent = `${mines}/${minesNeeded}`;
      bonusCountEl.textContent = `${bonuses}/${bonusNeeded}`;
    };

    const setTimer = (seconds, onFinish) => {
      clearInterval(timer);
      timerRemaining = seconds;
      timerEl.textContent = formatTime(timerRemaining);
      timer = setInterval(() => {
        timerRemaining -= 1;
        timerEl.textContent = formatTime(timerRemaining);
        if (timerRemaining <= 0) {
          clearInterval(timer);
          onFinish();
        }
      }, 1000);
    };

    const formatTime = (sec) => {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    };

    const setBankHolder = (player) => {
      bankHolder = player;
      updateBank();
    };

    const updateBank = () => {
      if (!bankHolder) return;
      bankEl.textContent = `${bankHolder.bank} €`;
    };

    const animateCount = (player, delta) => {
      let current = player.bank;
      const steps = 12;
      let frame = 0;
      const increment = delta / steps;
      const interval = setInterval(() => {
        frame++;
        current += increment;
        player.bank = Math.round(current);
        if (player === bankHolder) updateBank();
        bankEl.classList.add('money-rise');
        if (frame >= steps) {
          clearInterval(interval);
          bankEl.classList.remove('money-rise');
        }
      }, 40);
    };

    const handleDragStart = (e) => {
      if (phase !== 'place-mines' && phase !== 'place-bonus') return e.preventDefault();
      const token = e.target;
      if (token.classList.contains('used')) return e.preventDefault();
      e.dataTransfer.setData('type', token.dataset.type);
      e.dataTransfer.setData('id', token.dataset.id);
    };

    const handleDragOver = (e) => {
      if (!allowPlacement()) return;
      e.preventDefault();
      e.currentTarget.classList.add('drop-allowed');
    };

    const handleDragLeave = (e) => {
      e.currentTarget.classList.remove('drop-allowed');
    };

    const handleDrop = (e) => {
      if (!allowPlacement()) return;
      e.preventDefault();
      const idx = Number(e.currentTarget.dataset.index);
      const type = e.dataTransfer.getData('type');
      if (type === 'mine') placeMine(idx);
      if (type === 'bonus') placeBonus(idx);
      e.currentTarget.classList.remove('drop-allowed');
    };

    const allowPlacement = () => phase === 'place-mines' || phase === 'place-bonus';

    const placeMine = (idx) => {
      if (phase !== 'place-mines') return;
      const mines = board.filter(c => c.mine).length;
      if (mines >= minesNeeded) return;
      if (board[idx].bonus) return;
      board[idx].mine = true;
      placedRandomMines = Math.max(placedRandomMines - 1, 0);
      renderBoard();
      updateCounts();
      checkPlacementDone();
    };

    const placeBonus = (idx) => {
      if (phase !== 'place-bonus') return;
      const bonuses = board.filter(c => c.bonus).length;
      if (bonuses >= bonusNeeded) return;
      if (board[idx].mine) return;
      board[idx].bonus = true;
      placedRandomBonus = Math.max(placedRandomBonus - 1, 0);
      renderBoard();
      updateCounts();
      checkPlacementDone();
    };

    const handleCellRemove = (idx) => {
      if (!allowPlacement()) return;
      if (phase === 'place-mines' && board[idx].mine) {
        board[idx].mine = false;
        renderBoard();
        updateCounts();
      }
      if (phase === 'place-bonus' && board[idx].bonus) {
        board[idx].bonus = false;
        renderBoard();
        updateCounts();
      }
    };

    const renderBoard = () => {
      board.forEach((cell, idx) => {
        const el = boardEl.children[idx];
        el.className = 'cell';
        el.textContent = '';
        if (cell.mine && (phase === 'place-mines' || phase === 'place-bonus')) el.classList.add('mine-set');
        if (cell.bonus && (phase === 'place-bonus')) el.classList.add('bonus-set');
        if (cell.revealed) el.classList.add('revealed');
        if (cell.exploded) el.classList.add('dramatic');
        if (phase === 'reveal') el.classList.remove('locked');
      });
      updateCounts();
    };

    const createTray = (type) => {
      trayEl.innerHTML = '';
      const count = type === 'mine' ? minesNeeded : bonusNeeded;
      for (let i = 0; i < count; i++) {
        const token = document.createElement('div');
        token.className = `token ${type}`;
        token.draggable = true;
        token.dataset.type = type;
        token.dataset.id = `${type}-${i}`;
        token.textContent = type === 'mine' ? '💣' : '⭐';
        token.addEventListener('dragstart', handleDragStart);
        trayEl.appendChild(token);
      }
    };

    const enableTrayUsedState = () => {
      const type = placingType;
      const placed = board.filter(c => type === 'mine' ? c.mine : c.bonus).length;
      [...trayEl.children].forEach((token, idx) => {
        token.classList.toggle('used', idx < placed);
      });
    };

    const startRules = () => {
      phase = 'rules';
      const steps = [
        'Welcome! Each round one player hides 4 mines and 2 bonus tiles in the grid.',
        'Then the other player has 45 seconds to tap safe tiles and cash out.',
        'If you tap a mine, your turn ends. On your very first tap you get one mercy reroll.',
        'Bonuses secretly multiply your earnings at the very end of the match.',
        'Keep the phone hidden when told. The UI flips to respect seating.',
        'Ready? We will pick who starts.'
      ];
      typeLines(steps, () => chooseStarter());
    };

    const typeLines = (lines, done) => {
      let idx = 0;
      const next = () => {
        if (idx >= lines.length) return done();
        const text = lines[idx];
        typewriter(text, () => setTimeout(() => { idx++; next(); }, 900));
      };
      next();
    };

    const typewriter = (text, callback) => {
      let out = '';
      let i = 0;
      const speed = 24;
      const tick = () => {
        out += text[i];
        logToPanels(out);
        i++;
        if (i < text.length) setTimeout(tick, speed);
        else setTimeout(callback, 150);
      };
      tick();
    };

    const chooseStarter = () => {
      phase = 'pick-starter';
      const pick = Math.random() < 0.5 ? 0 : 1;
      order = [players[pick], players[1 - pick]];
      activePlayer = order[0];
      guesser = order[1];
      showOverlay(`Who starts?`, `Randomizing...`, [{ label: 'Reveal', action: () => {
        beep();
        showOverlay(`${activePlayer.id} starts!`, `${activePlayer.id}, pick up the phone and keep it hidden from ${guesser.id}.`, [{ label: 'Begin placement', action: () => hideOverlay(startMinePlacement) }]);
      }}]);
    };

    const showOverlay = (title, body, buttons = []) => {
      overlayCard.innerHTML = `<h2>${title}</h2><p>${body}</p>`;
      if (buttons.length) {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.gap = '10px';
        row.style.marginTop = '12px';
        buttons.forEach(btn => {
          const b = document.createElement('button');
          b.className = 'btn';
          b.textContent = btn.label;
          b.onclick = btn.action;
          row.appendChild(b);
        });
        overlayCard.appendChild(row);
      }
      overlay.classList.add('active');
    };

    const hideOverlay = (after) => {
      overlay.classList.remove('active');
      if (after) after();
    };

    const startCountdown = (seconds, label, after) => {
      countdownEl.textContent = `${label} ${seconds}`;
      beep();
      countdownTimer = setInterval(() => {
        seconds--;
        countdownEl.textContent = `${label} ${seconds}`;
        beep(660, 0.08);
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          countdownEl.textContent = '';
          beep(880, 0.15);
          after();
        }
      }, 1000);
    };

    const startMinePlacement = () => {
      phase = 'place-mines';
      placedRandomMines = 0;
      placedRandomBonus = 0;
      hider = activePlayer;
      setBankHolder(activePlayer);
      setRole(`${activePlayer.id} hiding mines`);
      logToPanels(`${activePlayer.id}, place 4 mines within 30 seconds. Double-tap to remove.`);
      createTray('mine');
      renderBoard();
      gridLocker.classList.remove('active');
      startCountdown(3, 'Get ready', () => {
        setTimer(30, finishMinePlacement);
      });
    };

    const finishMinePlacement = () => {
      const placed = board.filter(c => c.mine).length;
      if (placed < minesNeeded) {
        const remaining = minesNeeded - placed;
        placeRandom('mine', remaining);
        placedRandomMines = remaining;
        renderBoard();
        logToPanels(`Time! ${remaining} mines were dropped randomly.`);
      } else {
        showToast('Mines locked in.');
      }
      clearInterval(timer);
      setTimeout(() => startBonusPlacement(), 800);
    };

    const placeRandom = (type, amount) => {
      const free = board.map((c, idx) => ({ c, idx })).filter(({ c }) => !c.mine && !c.bonus);
      for (let i = 0; i < amount && free.length; i++) {
        const pick = Math.floor(Math.random() * free.length);
        const spot = free.splice(pick, 1)[0];
        board[spot.idx][type === 'mine' ? 'mine' : 'bonus'] = true;
      }
    };

    const checkPlacementDone = () => {
      enableTrayUsedState();
      const placed = placingType === 'mine' ? board.filter(c => c.mine).length : board.filter(c => c.bonus).length;
      const needed = placingType === 'mine' ? minesNeeded : bonusNeeded;
      if (placed >= needed) {
        const existing = trayEl.querySelector('.confirm-btn');
        if (existing) return;
        const confirm = document.createElement('button');
        confirm.className = 'btn confirm-btn';
        confirm.textContent = 'Confirm placements';
        confirm.onclick = () => {
          clearInterval(timer);
          placingType === 'mine' ? finishMinePlacement() : finishBonusPlacement();
        };
        trayEl.appendChild(confirm);
      }
    };

    const startBonusPlacement = () => {
      phase = 'place-bonus';
      placingType = 'bonus';
      trayEl.innerHTML = '';
      createTray('bonus');
      logToPanels(`${activePlayer.id}, place 2 bonus tiles in safe spots. 15 seconds.`);
      startCountdown(3, 'Bonus prep', () => {
        setTimer(15, finishBonusPlacement);
      });
    };

    const finishBonusPlacement = () => {
      const placed = board.filter(c => c.bonus).length;
      if (placed < bonusNeeded) {
        const remaining = bonusNeeded - placed;
        placeRandom('bonus', remaining);
        placedRandomBonus = remaining;
        renderBoard();
        logToPanels(`Time! ${remaining} bonus spots were tossed randomly.`);
      } else {
        showToast('Bonuses locked in.');
      }
      clearInterval(timer);
      passDeviceToGuesser();
    };

    const passDeviceToGuesser = () => {
      gridLocker.classList.add('active');
      showOverlay('Pass the device', `${activePlayer.id}, place the phone face down. ${guesser.id} will now guess.`, [{ label: 'Countdown to reveal', action: () => {
        hideOverlay(() => {
          startCountdown(3, 'Flip in', () => {
            startReveal();
          });
        });
      }}]);
    };

    const startReveal = () => {
      phase = 'reveal';
      firstRevealBomb = false;
      setBankHolder(guesser);
      setRole(`${guesser.id} is hunting safes`);
      const randomText = placedRandomMines ? `${placedRandomMines} mines landed randomly.` : 'All mines were placed by hand.';
      logToPanels(`${guesser.id}, 45 seconds to pick safe tiles. ${hider.id} hid 4 mines. ${randomText}`);
      gridLocker.classList.remove('active');
      board.forEach(c => { c.revealed = false; c.exploded = false; });
      renderBoard();
      updateBank();
      countdownEl.textContent = '';
      setTimer(45, endRevealDueToTime);
      startCountdown(3, 'Revealing in', () => { /* timer already running */ });
    };

    const handleReveal = (idx) => {
      if (phase !== 'reveal') return;
      const cell = board[idx];
      if (cell.revealed) return;
      cell.revealed = true;
      const el = boardEl.children[idx];
      el.classList.add('highlight');
      if (cell.mine) {
        cell.exploded = true;
        renderBoard();
        if (!firstRevealBomb) {
          firstRevealBomb = true;
          showToast('Mercy! First mine gives you one more try.');
          logToPanels(`${guesser.id} hit a mine but may continue (mercy). Dramatic!`);
          return;
        }
        endReveal('mine');
      } else {
        const reward = safeReward;
        animateCount(guesser, reward);
        logToPanels(`${guesser.id} found a safe tile! +${reward} €`);
      }
    };

    const endRevealDueToTime = () => {
      logToPanels('Timer! Hands off the grid.');
      endReveal('time');
    };

    const endReveal = (reason) => {
      phase = 'reveal-end';
      gridLocker.classList.add('active');
      clearInterval(timer);
      if (reason === 'mine') logToPanels(`${guesser.id} hit a mine. Turn ends.`);
      revealAllMines(() => {
        setTimeout(() => startNextRound(), 1200);
      });
    };

    const revealAllMines = (done) => {
      board.forEach((cell, idx) => {
        if (cell.mine) {
          const el = boardEl.children[idx];
          setTimeout(() => {
            el.classList.add('dramatic');
            el.textContent = '💣';
            beep(140, 0.1);
          }, 80 * idx);
        }
      });
      setTimeout(done, 80 * board.length + 400);
    };

    const startNextRound = () => {
      currentRound += 1;
      if (currentRound >= 2) {
        finalReveal();
        return;
      }
      // swap roles
      const nextActive = guesser;
      const nextGuesser = hider;
      activePlayer = nextActive;
      guesser = nextGuesser;
      showOverlay('Swap roles', `${activePlayer.id} now hides mines. ${guesser.id} look away.`, [{ label: 'Start hiding', action: () => hideOverlay(() => {
        resetBoard();
        placingType = 'mine';
        startMinePlacement();
      }) }]);
    };

    const finalReveal = () => {
      phase = 'final';
      logToPanels('Final bonuses are opening...');
      showOverlay('Final bonuses', 'Both grids appear with revealed info. Bonuses now apply!', []);
      // For this simple prototype we reuse the last board for reveal demo
      const hitBonuses = board.filter(c => c.revealed && c.bonus).length;
      const bonusGain = hitBonuses * bonusReward;
      if (bonusGain > 0) {
        animateCount(guesser, bonusGain);
      }
      setTimeout(() => {
        overlayCard.innerHTML += `<p>Bonuses touched: ${hitBonuses}. Extra ${bonusGain} €.</p>`;
        overlayCard.innerHTML += `<p>${players[0].id} bank: ${players[0].bank} € · ${players[1].id} bank: ${players[1].bank} €</p>`;
        const winner = players[0].bank === players[1].bank ? 'Tie!' : (players[0].bank > players[1].bank ? `${players[0].id} wins!` : `${players[1].id} wins!`);
        overlayCard.innerHTML += `<h3>${winner}</h3>`;
        overlayCard.innerHTML += `<p>Bonuses give +${bonusReward} € each for any you uncovered. Thanks for playing. Fade out...</p>`;
      }, 1000);
    };

    const setup = () => {
      resetBoard();
      document.getElementById('startBtn').addEventListener('click', startRules);
    };

    setup();
  </script>
</body>
</html>
